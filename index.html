<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b10" />
  <meta name="description" content="机器人产品图片与视频展示" />
  <title>产品展示</title>
  <link rel="stylesheet" href="./assets/styles.css" />
  <script>
    // GitHub Pages SPA 兜底：还原 404.html 写入 ?p= 的深链路由
    (function () {
      var m = /[?&]p=([^&]+)/.exec(location.search);
      if (m) { history.replaceState(null, '', decodeURIComponent(m[1])); }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="./assets/app.js" defer></script>
</body>
</html>
