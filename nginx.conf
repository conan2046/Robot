server {
    listen 80;
    server_name _;
    root /var/www/robot-showcase/docs;
    index index.html;

    location = /data/site-data.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /content/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
